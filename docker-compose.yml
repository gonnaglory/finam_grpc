services:
  redis:
    image: redis
    container_name: redis
    restart: unless-stopped
    command: >
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 60 1
      --stop-writes-on-bgsave-error no
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - quotes_net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  collector:
    build:
      context: .
      dockerfile: Dockerfile
    image: quotes-collector:latest
    container_name: quotes_collector
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      FINAM_HOST: ${FINAM_HOST}
      FINAM_TOKEN: ${FINAM_TOKEN}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks:
      - quotes_net
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  quotes_net:
    driver: bridge

volumes:
  redis_data: